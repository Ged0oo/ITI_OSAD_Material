<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task8</title>

    <style>
        body { background-color: #df8037; font-family: sans-serif; padding: 20px; }
        
        .container { max-width: 600px; margin: auto; }
        
        .form-group { margin-bottom: 10px; display: flex; align-items: center; }
        
        label { width: 60px; font-weight: bold; }
        
        input { padding: 5px; border: 1px solid #ccc; width: 150px; }
        
        .error { color: red; font-size: 12px; margin-left: 10px; }
        
        .buttons { margin-left: 60px; margin-bottom: 20px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
        
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
        
        th { background-color: #fceea7; }
    </style>

</head>
<body>
    <div class="container">

        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="name">
            <span id="nameErr" class="error"></span>
        </div>
        
        <div class="form-group">
            <label>Age:</label>
            <input type="number" id="age">
            <span id="ageErr" class="error"></span>
        </div>
        
        <div class="form-group">
            <label>E-mail:</label>
            <input type="text" id="email">
            <span id="emailErr" class="error"></span>
        </div>

        <div class="buttons">
            <button type="button" onclick="addData()">Add</button>
            <button type="button" onclick="resetFields()">Reset</button>
            <button type="button" onclick="clearTable()">Clear</button>
        </div>

        <table id="dataTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>E-mail</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script src="./script.js"></script>
</body>
</html>
