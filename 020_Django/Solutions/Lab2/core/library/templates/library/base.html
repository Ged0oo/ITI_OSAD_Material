{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School System</title>
    <link rel="stylesheet" href="{% static 'library/style.css' %}">
</head>
<body>
<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <a href="{% url 'home' %}">ITI</a>
        </div>

        <div class="nav-links" aria-label="Main navigation">
            {% if user.is_authenticated %}
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'students' %}">Students</a>
            <a href="{% url 'subjects' %}">Subjects</a>
            <a href="{% url 'grade' %}">Grade</a>
            <a href="{% url 'userprofile' %}">Profile</a>
            <a href="{% url 'contact' %}">Contact Us</a>
            <a href="{% url 'logout' %}">Logout</a>
            {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'signup' %}">Signup</a>
            {% endif %}
        </div>
    </div>
</nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
