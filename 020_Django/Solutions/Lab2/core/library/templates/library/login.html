{% extends 'library/base.html' %}

{% block content %}
<h1>Login</h1>

<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a class="inline-link" href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock content %}
