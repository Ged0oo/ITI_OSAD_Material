<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeTrack Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 2rem;
      background: #f4f4f9;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .event-card {
      background: white;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }

    .type {
      font-weight: bold;
      text-transform: uppercase;
      color: #0056b3;
    }

    .time {
      color: #888;
      font-size: 0.9rem;
    }

    .desc {
      font-size: 1.1rem;
    }

    .duration {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.2rem 0.6rem;
      background: #e9ecef;
      border-radius: 12px;
      font-size: 0.85rem;
    }
  </style>
</head>

  <body>
    <div class="container">
      <h1>LifeTrack Dashboard</h1>
      <div class="event-card">
  <div class="event-header">
    <span class="type">Work</span>
    <span class="time">2026-06-19 01:00</span>
  </div>

  <div class="desc">gjj hjh jh</div>

  <div class="duration">
    ⏱ 55 min
  </div>
</div>

    </div>
  </body>
</html>
